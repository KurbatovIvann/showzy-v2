# Coolify compose for the web panel static app (web-T2, ADR-0030).
# One service: Caddy serving the built SPA and proxying /rpc + /api/auth to
# the API service on the same Coolify network (same-origin — no CORS).
# Point the Coolify resource at this file; the public domain attaches to the
# `web` service via the platform ingress (Traefik), which terminates TLS.
#
# Environment (set in Coolify, not here):
#   API_UPSTREAM — API service origin inside the deployment network,
#                  e.g. http://api:3000. Never a public URL.
#   WEB_PORT    — container listen port (defaults to 8080).
#
# API-side pair of this topology (two settings, both required):
#   1. The public panel origin (the domain routed to this service) must be
#      listed in the API's WEB_APP_ORIGINS so better-auth trusts it
#      (packages/config, apps/api/src/auth/options.ts).
#   2. The API's TRUSTED_PROXIES must include this web/Caddy hop's address
#      (or the Coolify overlay network CIDR). The client-IP chain crosses
#      two proxies — ingress (Traefik) → Caddy → API — and Hono only trusts
#      X-Forwarded-* from TRUSTED_PROXIES (security-operations §2). Caddy
#      forwards the ingress-provided chain (trusted_proxies in the
#      Caddyfile), but if the API does not trust the Caddy hop it falls
#      back to the socket peer and every panel client shares one OTP
#      rate-limit bucket. Either hop alone still loses the client IP.

services:
  web:
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:3000}
      WEB_PORT: ${WEB_PORT:-8080}
    expose:
      # Must match the Caddyfile listen port; both default WEB_PORT to 8080.
      - "${WEB_PORT:-8080}"
    restart: unless-stopped
