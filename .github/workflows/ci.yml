# CI pipeline v1 (fnd-T2) — the verification gate from docs/pipeline.md §6,
# docs/specs/security-operations.md §7, and docs/blueprint.md §7.1(6).
#
# Job names are stable identifiers: branch protection requires them by name
# (docs/operations/branch-protection.md). `e2e-smoke` is still a named
# placeholder (fnd-T51); every other job is live.
#
# All third-party actions are pinned to full commit SHAs (verified against the
# official repos' tags) because this workflow is itself the merge gate.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Push-triggered CI without a PR, e.g. the fnd-T2 seeded-formatting-
      # violation meta-verification. Throwaway branches run the workflow file
      # from their own ref, so gate changes can be exercised before merge.
      - "throwaway/**"
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists PR commits via the GitHub API on pull_request events.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs always complete.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Format → typecheck → ESLint → Vitest, in the blueprint §7.1(6) gate order.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm (version from packageManager field)
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Vitest
        run: pnpm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — gitleaks scans commits)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency gate. GitHub's dependency-review-action is unavailable here
  # (private user-owned repo; it requires a public repo or an organization
  # with GitHub Code Security/Advanced Security), so the gate is `pnpm audit`
  # over the committed lockfile. Switch path is documented in
  # docs/operations/branch-protection.md.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm (version from packageManager field)
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: pnpm audit (fail on high/critical advisories)
        run: pnpm audit --audit-level high

  # Remaining placeholder gates exit green until their owning foundation task
  # replaces them. Job names are final. `e2e-smoke` is still a placeholder
  # (fnd-T51); `bundle-probe` is live (fnd-T25).

  contract-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm (version from packageManager field)
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Action/event contract check (core.md §2, fnd-T10)
        # Walks apps/api composition: importing it executes define/implement
        # time validation for every registered action, then runContractCheck
        # (core library) enforces the registry-wide rule matrix. Module tasks
        # register here — never in packages/core.
        run: pnpm --filter @showzy/api contract:check

  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm (version from packageManager field)
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Auth schema regeneration reproducibility (fnd-T6)
        # Re-runs the better-auth CLI generation and fails when the committed
        # packages/db/src/schema/auth.ts differs — the generated schema can
        # never drift from the configured better-auth plugin set.
        run: pnpm --filter @showzy/api auth:check

      - name: Migration drift and money schema checks
        run: pnpm --filter @showzy/db db:check

      - name: Runtime database grant integration
        run: pnpm --filter @showzy/db exec vitest run src/foundation.test.ts

      - name: Backup verify dry-run (fnd-T28, db.md §6)
        run: pnpm --filter @showzy/db backup:verify -- --dry-run

  bundle-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm (version from packageManager field)
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Client bundle probe (contract.md §2, ADR-0016, fnd-T25)
        run: pnpm --filter @showzy/contract bundle:probe

      - name: OpenAPI drift check (contract.md §5, fnd-T25)
        run: pnpm --filter @showzy/contract openapi:check

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "Placeholder — phase-aware e2e (Maestro) lands with fnd-T51; Playwright only from the web phase."
