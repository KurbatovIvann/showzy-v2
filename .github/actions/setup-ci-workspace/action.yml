# Shared Node 22 + pnpm workspace setup for independent CI jobs (SHO-334).
# Each quality job calls this after its own checkout so the jobs do not wait
# on a serial setup job. Caches the pnpm store via setup-node (SHO-333:
# do not cache installed workspace packages).
name: Setup CI workspace
description: pnpm, Node 22, and frozen-lockfile install for independent CI jobs
inputs:
  install:
    description: Install workspace dependencies with a frozen lockfile
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up pnpm (version from packageManager field)
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

    - name: Set up Node 22
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"
        cache: pnpm

    - name: Install dependencies (frozen lockfile)
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
