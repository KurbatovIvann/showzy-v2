# Local development stack (fnd-T3): PostgreSQL 17, Redis, MinIO.
# Blueprint §3 — prod runs the same shape (self-hosted PG/Redis, R2 for S3).
# Dev-only credentials below intentionally match .env.example; real
# environments get secrets through validated env (packages/config), never
# from this file.
#
# MinIO's community Docker images stopped being published in 2025 (the repo
# was archived in 2026), so both tags pin the last released images. Fine for
# a local S3 stand-in — production uses Cloudflare R2 (blueprint §3).

# Explicit project name: the v1 repo's compose project is `showzy` on the
# same machines — this must never collide with it.
name: showzy-v2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: showzy
      POSTGRES_PASSWORD: showzy
      POSTGRES_DB: showzy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the pg_trgm + unaccent extensions (db.md §3) on first boot.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showzy -d showzy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # No persistence volume: Redis holds only rebuildable state — cache,
    # rate limits, Socket.IO adapter, BullMQ (db.md §6).
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: showzy-local
      MINIO_ROOT_PASSWORD: showzy-local-secret
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bucket bootstrap: the buckets carried over from v1 (blueprint §6).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 showzy-local showzy-local-secret &&
        mc mb --ignore-existing local/documents-bucket local/chat-attachments
    restart: "no"

volumes:
  postgres-data:
  minio-data:
